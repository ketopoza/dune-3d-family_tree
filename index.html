<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Árbol Genealógico 3D</title>
  <style>
    body { 
      margin: 0; 
      overflow: hidden; 
      background-color: #f8f9fb;
      font-family: system-ui, sans-serif;
    }
    
    #three-container {
      position: fixed;
      left: 0;
      top: 0;
      width: 60vw;
      height: 100vh;
      z-index: 1;
    }
    
    /* DESENFOCUE LONGITUDINAL (nítido cerca → desenfoque fondo) */
    #three-container::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(
        to bottom, 
        transparent 0%,                    /* CERCA CÁMARA: NÍVIDO */
        rgba(248,249,251,0.15) 35%,       
        rgba(248,249,251,0.35) 65%,       /* FONDO: DESENFOCADO */
        rgba(248,249,251,0.55) 100%
      );
      pointer-events: none;
      z-index: 1;
      mix-blend-mode: screen;
    }
    
    #three-container canvas {
      position: relative;
      z-index: 2;
    }
    
    /* PANEL INFO */
    #info-panel {
      position: fixed;
      right: 20px;
      top: 20px;
      padding: 16px;
      background: white;
      border-radius: 12px;
      border: 1px solid #ddd;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      max-width: 320px;
      display: none;
      font-family: system-ui, sans-serif;
      font-size: 14px;
      z-index: 1000;
    }
    #info-nombre {
      margin: 0 0 8px 0;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    #info-fechas {
      margin: 0 0 16px 0;
      font-size: 12px;
      color: #888;
      font-style: italic;
    }
    #info-descripcion {
      margin: 0 0 16px 0;
      font-size: 14px;
      line-height: 1.5;
      color: #444;
    }
    #info-saga {
      margin: 0;
      font-size: 13px;
      font-style: italic;
      color: #666;
      border-top: 1px solid #eee;
      padding-top: 8px;
    }
    #info-cerrar {
      position: absolute;
      top: 12px;
      right: 12px;
      border: none;
      background: none;
      font-size: 18px;
      cursor: pointer;
      color: #999;
      padding: 0;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #info-cerrar:hover {
      color: #333;
      background: #f0f0f0;
      border-radius: 50%;
    }
  </style>
</head>
<body>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<div id="three-container"></div>
<script type="module" src="./main.js"></script>

<!-- PANEL INFORMACIÓN -->
<div id="info-panel">
  <button id="info-cerrar">✕</button>
  <h1 id="info-nombre"></h1>
  <p id="info-fechas"></p>
  <p id="info-descripcion"></p>
  <p id="info-saga"></p>
</div>

</body>
</html>
